name: osv-compare
on:
  workflow_dispatch:
    inputs:
      images:
        description: "newline-separated image refs"
        required: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          refs = [l.strip() for l in os.environ["IMAGES"].splitlines() if l.strip()]
          print("matrix=" + json.dumps({"include": [{"i": n, "ref": r} for n, r in enumerate(refs)]}))
          PY
  compare:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -fsSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          curl -fsSL -o crane.tgz https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  crane.tgz" | sha256sum -c -
          tar -xzf crane.tgz crane
          chmod +x osv-scanner crane
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: compare
        env:
          REF: ${{ matrix.ref }}
          N: ${{ matrix.i }}
        run: |
          set +e
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          avail() { df -B1M --output=avail / | tail -1 | tr -d ' '; }
          now() { date +%s.%N; }
          echo "$REF" > "$out/ref.txt"
          # docker path
          d0=$(avail); t0=$(now)
          osv-scanner scan image --all-packages --format json "$REF" > "$out/docker.json" 2> "$out/docker.err"
          dr=$?; t1=$(now); d1=$(avail)
          docker image rm -f "$REF" >/dev/null 2>&1
          # daemonless path
          e0=$(avail); s0=$(now)
          crane pull --platform linux/amd64 "$REF" "$RUNNER_TEMP/x.tar" 2> "$out/crane.err"
          cr=$?; s1=$(now); e1=$(avail)
          sr=-1
          if [ $cr -eq 0 ]; then
            osv-scanner scan image --archive --all-packages --format json "$RUNNER_TEMP/x.tar" > "$out/archive.json" 2> "$out/archive.err"
            sr=$?
          fi
          s2=$(now); e2=$(avail)
          rm -f "$RUNNER_TEMP/x.tar"
          python3 - "$out/meta.json" <<PY
          import json, sys
          json.dump({"ref": "$REF", "docker_exit": $dr, "docker_sec": round($t1-$t0, 1),
                     "docker_disk_used_mb": $d0-$d1, "crane_exit": $cr, "crane_sec": round($s1-$s0, 1),
                     "crane_disk_used_mb": $e0-$e1, "archive_exit": $sr, "archive_total_sec": round($s2-$s0, 1),
                     "archive_peak_disk_used_mb": $e0-$e2}, open(sys.argv[1], "w"))
          PY
          cat "$out/meta.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmp-${{ matrix.i }}
          path: ${{ runner.temp }}/out
